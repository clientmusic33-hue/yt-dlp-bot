# ============================================================================
# docker-compose.render.yml - Optimized for Render Deployment
# ============================================================================
# This is a simplified version for Render
# Use this for local testing before deploying to Render

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: yt_postgres
    environment:
      POSTGRES_USER: yt
      POSTGRES_PASSWORD: yt_password_change_me
      POSTGRES_DB: yt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yt -d yt"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:alpine
    container_name: yt_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: yt_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: app_api/Dockerfile
    container_name: yt_api
    environment:
      # Common
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONASYNCIODEBUG: "0"
      POSTGRES_USER: yt
      POSTGRES_PASSWORD: yt_password_change_me
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: yt
      SQLALCHEMY_ECHO: "False"
      SQLALCHEMY_EXPIRE_ON_COMMIT: "False"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      TMP_DOWNLOAD_ROOT_PATH: /tmp/download_tmpfs
      TMP_DOWNLOAD_DIR: downloading
      TMP_DOWNLOADED_DIR: downloaded
      LOG_LEVEL: INFO
      # API Specific
      APPLICATION_NAME: yt_api
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 4
    ports:
      - "1984:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - shared-tmpfs:/tmp/download_tmpfs

  # Bot Service
  bot:
    build:
      context: .
      dockerfile: app_bot/Dockerfile
    container_name: yt_bot
    environment:
      # Common
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONASYNCIODEBUG: "0"
      POSTGRES_USER: yt
      POSTGRES_PASSWORD: yt_password_change_me
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: yt
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      TMP_DOWNLOAD_ROOT_PATH: /tmp/download_tmpfs
      LOG_LEVEL: INFO
      # Bot Specific
      APPLICATION_NAME: yt_bot
      TG_MAX_MSG_SIZE: 4096
      TG_MAX_CAPTION_SIZE: 1024
    volumes:
      - ./app_bot/config.yml:/app/app_bot/config.yml:ro
      - shared-tmpfs:/tmp/download_tmpfs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      worker:
        condition: service_started
    restart: unless-stopped

  # Worker Service
  worker:
    build:
      context: .
      dockerfile: app_worker/Dockerfile
    container_name: yt_worker
    environment:
      # Common
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      POSTGRES_USER: yt
      POSTGRES_PASSWORD: yt_password_change_me
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: yt
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      TMP_DOWNLOAD_ROOT_PATH: /tmp/download_tmpfs
      TMP_DOWNLOAD_DIR: downloading
      TMP_DOWNLOADED_DIR: downloaded
      LOG_LEVEL: INFO
      # Worker Specific
      APPLICATION_NAME: yt_worker
      MAX_SIMULTANEOUS_DOWNLOADS: 2
      MAX_DOWNLOAD_THREADS: 10
      STORAGE_PATH: /filestorage
      THUMBNAIL_FRAME_SECOND: 10.0
      INSTAGRAM_ENCODE_TO_H264: "True"
      FACEBOOK_ENCODE_TO_H264: "True"
    volumes:
      - ./app_bot/config.yml:/app/app_bot/config.yml:ro
      - ./downloads:/filestorage
      - shared-tmpfs:/tmp/download_tmpfs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  shared-tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=7168m,uid=1000
